<body>
    <div class="form-container">
        <!-- Formulario de Inicio de Sesión -->
        <form action="validarlogin.php" method="POST" id="login-form" class="form active-form">

        </form>

        <!-- Formulario de Registro -->
        <form action="guardar.php" method="POST" id="register-form" class="form">
            <h2>Registro</h2>
            
            <div id="error-message-register" class="error-message"></div>

            <div class="input-group">
                <input type="text" name="username" placeholder="Username" required>
            </div>
            
            <div class="input-group">
                <input type="password" name="contrasena" placeholder="contrasena" required>
            </div>

            </div>

    </div>

    <script>
        // Alternar entre formularios de login y registro
        document.getElementById('show-register').addEventListener('click', function(event) {
            event.preventDefault();
            document.getElementById('login-form').classList.remove('active-form');
            document.getElementById('register-form').classList.add('active-form');
        });

        document.getElementById('show-login').addEventListener('click', function(event) {
            event.preventDefault();
            document.getElementById('register-form').classList.remove('active-form');
            document.getElementById('login-form').classList.add('active-form');
        });
    </script>
